<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loja Online</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <h1>DEISI STORE</h1>

      <nav>
        <ul>
          <li><a href="#produtos">Produtos</a></li>
          <li><a href="#cesto">Cesto</a></li>
          <li>
            <select id="filtro-categoria" aria-label="Filtrar por categoria">
              <option value="">Todas as categorias</option>
            </select>
          </li>
          <li>
            <div id="barra-ferramentas">
              <input
                type="search"
                id="pesquisa"
                placeholder="Pesquisar produto..."
                aria-label="Pesquisar produto"
              />

              <select id="ordenar" aria-label="Ordenar por preço">
                <option value="">Ordenar por</option>
                <option value="asc">Preço crescente</option>
                <option value="desc">Preço decrescente</option>
              </select>
            </div>
          </li>
        </ul>
      </nav>
    </header>

    <main>
      <section id="produtos">
        <h2>Os nossos produtos</h2>
        <div id="lista-produtos"></div>
      </section>

      <section id="cesto">
        <h2>O teu cesto</h2>
        <p>Os produtos que escolheste aparecem aqui.</p>

        <div id="lista-cesto"></div>

        <h3>Total: <span id="total">0.00 €</span></h3>
      </section>
    </main>

    <footer>
      <p>2026 | ULusófona</p>
    </footer>

    <script src="scripts/main.js"></script>
  </body>
</html>
