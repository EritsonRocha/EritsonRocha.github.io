<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <p id="passa" onmouseover="passarPorAqui()" onmouseout="sair()">
      Passa por aqui!
    </p>

    <p id="pinta">Pinta-me!</p>

    <div>
      <button onclick="pintar('red')">Red</button>
      <button onclick="pintar('green')">Green</button>
      <button onclick="pintar('blue')">Blue</button>
    </div>

    <p>Experimenta escrever...</p>

    <input
      type="text"
      id="escrever"
      onkeydown="escrever()"
      onkeyup="apagar()"
    />

    <p>Escolha uma cor em inglês:</p>

    <input type="text" id="cor" />
    <button onclick="mudarFundo()">Submeter</button>

    <p>
      <button onclick="contar()">Conta!</button>
      <span id="numero">0</span>
    </p>

    <script src="scripts/main.js"></script>
  </body>
</html>
